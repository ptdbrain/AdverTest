# Independent Render validation stack. It never names or manages production resources.
services:
  - type: web
    name: advertest-portable-api-preview
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: advertest-portable-preview-db
          property: connectionString
      - key: DATA_ROOT
        value: ./data
      - key: ARTIFACT_ROOT
        value: ./data/artifacts
      - key: CHECKPOINT_ROOT
        value: ./data/checkpoints
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        value: https://storage.googleapis.com
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: advertest-portable-frontend-preview
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: advertest-portable-preview-db
    plan: starter
    region: singapore
    postgresMajorVersion: "15"
