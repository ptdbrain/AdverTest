services:
  - type: web
    name: advertest-frontend
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerCommand: sh -c 'npm run start -- -p ${PORT:-10000}'
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: advertest-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn src.main:app --host 0.0.0.0 --port 10000
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: BOOTSTRAP_DEMO_CATALOG
        value: "true"
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: advertest-postgres
          property: connectionString
      - key: QUEUE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: advertest-queue
          property: connectionString
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CHECKPOINT_SANDBOX_URL
        sync: false
      - key: CHECKPOINT_SANDBOX_TOKEN
        sync: false

  - type: worker
    name: advertest-platform-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m src.platform_worker
    maxShutdownDelaySeconds: 300
    envVars:
      - key: APP_ENV
        value: production
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: advertest-postgres
          property: connectionString
      - key: QUEUE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: advertest-queue
          property: connectionString
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: CHECKPOINT_SANDBOX_URL
        sync: false
      - key: CHECKPOINT_SANDBOX_TOKEN
        sync: false

  - type: keyvalue
    name: advertest-queue
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: advertest-postgres
    region: singapore
    plan: basic-256mb
    databaseName: advertest
    user: advertest
    ipAllowList: []
