# Render preview/demo Blueprint. This is intentionally separate from render.yaml:
# it uses only Free-supported service types and processes platform jobs inside the
# API process, so it is not suitable for production workloads.
services:
  - type: web
    # Keep the existing frontend service during the transition. Render creates
    # this demo endpoint under the service name when the Blueprint is synced.
    name: c4-app-advertest
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerCommand: sh deploy/start-frontend.sh
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: advertest-api-free
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free Render services cannot use preDeployCommand. The single demo API
    # instance applies migrations before serving requests instead.
    dockerCommand: sh deploy/start-api-free.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: advertest-postgres-free
          property: connectionString
      # A bounded in-process queue replaces the paid background worker and
      # Redis. Jobs only run while this free API service is awake.
      - key: QUEUE_BACKEND
        value: local
      - key: WORKER_MAX_CONCURRENCY
        value: "1"
      - key: BOOTSTRAP_DEMO_MODEL
        value: "true"
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: advertest-postgres-free
    region: singapore
    plan: free
    databaseName: advertest
    user: advertest
    ipAllowList: []
