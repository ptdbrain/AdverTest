# Render Blueprint Configuration for AdverTest Platform
# Plan reference: AdverTest_Implementation_Plan_4_People.md (§21-§26, §76, §108)
services:
  - type: web
    name: advertest-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: uv pip install -r pyproject.toml
    startCommand: uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: advertest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: advertest-redis
          property: connectionString
      - key: S3_BUCKET_NAME
        value: advertest-production-artifacts
      - key: S3_ENDPOINT_URL
        value: https://s3.ap-southeast-1.amazonaws.com
      - key: CORS_ORIGINS
        value: https://advertest.onrender.com,http://localhost:3000

  - type: worker
    name: advertest-compute-worker
    runtime: python
    region: singapore
    plan: standard
    buildCommand: uv pip install -r pyproject.toml
    startCommand: uv run python -m src.compute.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: advertest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: advertest-redis
          property: connectionString

  - type: web
    name: advertest-frontend
    runtime: node
    region: singapore
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: advertest-api
          property: host

databases:
  - name: advertest-db
    plan: starter
    region: singapore
    postgresMajorVersion: "15"

# Redis-compatible managed key-value store for Celery/job queuing
# Plan §21: Redis / Queue
